! Fictional lab config for testing netaudit. All values are made up.
! Addresses use documentation ranges (RFC 5737).
version 15.2
service timestamps debug uptime
no service password-encryption
!
hostname EDGE-RTR-01
!
enable password lab-enable-1
!
username admin privilege 15 password 0 lab-admin-1
username ops password 7 08243C4F1C5A0A16
!
ip domain-name lab.example
ip http server
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 192.0.2.2 255.255.255.252
!
interface GigabitEthernet0/1
 description LAN
 ip address 198.51.100.1 255.255.255.0
!
ip access-list extended OUTSIDE-IN
 permit tcp any any eq 22
 permit ip any any
!
snmp-server community public RO
snmp-server community private RW
snmp-server community lab-monitor-x RO
!
line con 0
 exec-timeout 0 0
 password lab-console-1
 login
line vty 0 4
 password lab-vty-1
 login
 transport input all
!
end
