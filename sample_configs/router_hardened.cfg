! Fictional lab config for testing netaudit. All values are made up.
! Addresses use documentation ranges (RFC 5737); hashes are placeholders.
version 17.9
service timestamps log datetime msec
service password-encryption
!
hostname EDGE-RTR-02
!
aaa new-model
aaa authentication login default local
!
enable secret 9 $9$PLACEHOLDER-NOT-A-REAL-HASH
username netadmin privilege 15 secret 9 $9$PLACEHOLDER-NOT-A-REAL-HASH
!
ip domain-name lab.example
ip ssh version 2
no ip http server
ip http secure-server
!
logging host 192.0.2.50
ntp server 192.0.2.123
ntp server 192.0.2.124
!
banner login ^C
Authorized access only. Activity may be monitored.
^C
!
ip access-list standard MGMT-ONLY
 permit 192.0.2.0 0.0.0.255
!
ip access-list extended OUTSIDE-IN
 permit tcp any host 198.51.100.10 eq 443
 deny ip any any log
!
snmp-server group MONITOR v3 priv
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 192.0.2.2 255.255.255.252
!
line con 0
 exec-timeout 5 0
 login local
line vty 0 4
 access-class MGMT-ONLY in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
